name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Serialize so both platform jobs don't race to create the same
      # GitHub release for the tag.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The "Set version from tag" step modifies package.json deliberately;
      # the build must not be stamped as dirty because of it.
      IGNORE_GIT_DIRTY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # The tag (vX.Y.Z) is the single source of truth for the version;
        # package.json is updated in the workspace only, never committed.
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Tests
        run: pnpm test

      - name: Generate frontend
        run: pnpm generate

      - name: Compile Electron main
        run: pnpm electron:compile

      - name: Build and publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish always

  release-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Add install instructions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes "$(cat <<'EOF'
          ## Installation

          **Windows** — run the `.exe` installer. Installed apps update themselves in-app.

          **macOS** — download the `.dmg` for your machine (`arm64` = Apple Silicon, `x64` = Intel) and drag the app to Applications. The app is not notarized, so macOS quarantines downloads; allow it once per machine:

          ```
          xattr -d com.apple.quarantine "/Applications/POS App.app"
          ```

          (or: open it once, then System Settings → Privacy & Security → "Open Anyway")
          EOF
          )"
