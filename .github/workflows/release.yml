name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Serialize so both platform jobs don't race to create the same
      # GitHub release for the tag.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # The tag (vX.Y.Z) is the single source of truth for the version;
        # package.json is updated in the workspace only, never committed.
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Tests
        run: pnpm test

      - name: Generate frontend
        run: pnpm generate

      - name: Compile Electron main
        run: pnpm electron:compile

      - name: Build and publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish always
