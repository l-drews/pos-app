appId: dev.pos-app.app
productName: POS App
directories:
  output: release
  buildResources: build
files:
  - ".output/public/**/*"
  - "electron/dist/**/*"
  - "server/db/migrations/**/*"
  - "package.json"
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
# Auto-update metadata (latest.yml / latest-mac.yml) and artifacts are
# published to GitHub Releases by CI (release.yml) via --publish always.
# releaseType "release" publishes immediately — electron-updater ignores drafts.
publish:
  provider: github
  owner: l-drews
  repo: pos-app
  releaseType: release
mac:
  # zip is required by Squirrel.Mac for auto-update; both Apple Silicon and
  # Intel are built. Note: in-place auto-update on macOS additionally requires
  # code signing — until then mac users are pointed at the release page.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.business
win:
  target: nsis
